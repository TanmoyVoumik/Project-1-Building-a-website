<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Tool Web App</title>
</head>

<body>
    <header>
        <h1>Multi-Tool Web App</h1>
        <nav>
            <ul>
                <li><a href="#audio-enhancer">Audio Enhancer</a></li>
                <li><a href="#coming-soon">More tools are coming soon</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="audio-enhancer">
            <h2>Audio Enhancer</h2>
            
            <!-- File upload area -->
            <div>
                <label for="audio-file">Upload Audio File:</label>
                <input type="file" id="audio-file" accept="audio/*">
            </div>

            <!-- Audio Players -->
            <div>
                <h3>Original Audio</h3>
                <audio id="original-audio" controls></audio>
            </div>

            <div>
                <h3>Enhanced Audio</h3>
                <audio id="enhanced-audio" controls></audio>
            </div>
            <div>
    <label for="volume-slider">Volume:</label>
    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1">
    </div>
    <p> hello sir </p>
</section>
    </main>
</body>
</html>
